<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SimulationLE / Science 科学计算案例档案。探索科学软件中的观测、推断、预测与验证。">
  <meta name="theme-color" content="#f7f6f1">
  <title>SimulationLE / Science · 科学计算案例档案</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/site.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span><span>SimulationLE <span class="brand-slash">/</span> Science</span></a>
      <nav aria-label="主导航"><a href="#cases" aria-current="page">案例档案</a><a class="nav-external" href="https://huayuankou333.github.io/omniale/simulationle-engineer/">Engineer <span aria-hidden="true">↗</span></a></nav>
    </div>
  </header>
  <main id="main">
    <section class="wrap hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">从观测出发，<br>让推断可验证。</h1>
        <a class="button" href="#cases">浏览案例</a>
      </div>
      <a class="hero-figure" href="cases/longitudinal-pet-bounds/" aria-label="查看纵向 PET 摄取变化案例">
        <canvas data-plot="pet-hero" role="img" aria-label="两次访问的合成 PET 体模示意，展示形状和摄取信号的空间差异"></canvas>
        <div class="figure-bottom"><b>纵向 PET 摄取变化</b><span class="figure-note">示意图</span><span class="figure-link" aria-hidden="true">↗</span></div>
      </a>
    </section>
    <section id="cases" class="case-section">
      <div class="wrap">
        <div class="section-head">
          <h2>科学计算案例</h2>
          <label class="search"><span class="search-icon" aria-hidden="true"></span><input type="search" id="case-search" placeholder="搜索案例" aria-label="搜索案例、软件或领域"></label>
        </div>
        <div class="filters" role="group" aria-label="按领域筛选">
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="imaging" aria-pressed="false">影像科学</button>
          <button type="button" data-filter="thermal" aria-pressed="false">热学</button>
          <button type="button" data-filter="metabolism" aria-pressed="false">生物学</button>
          <button type="button" data-filter="mechanics" aria-pressed="false">材料学</button>
          <span class="sr-only" id="case-count" role="status">4 个案例</span>
        </div>
        <div class="case-grid">
          <article class="case-card" data-domain="imaging" data-keywords="longitudinal-pet-bounds 定量影像 配准 分辨率 测量误差 不确定性 体模">
            <a class="case-link" href="cases/longitudinal-pet-bounds/" aria-labelledby="case-pet">
              <div class="card-visual theme-pet"><canvas data-plot="pet-card" role="img" aria-label="配对 PET 体模示意"></canvas></div>
              <div class="card-body"><h3 id="case-pet">纵向 PET 摄取变化</h3><p class="case-meta"><strong>影像科学</strong> <span>3D Slicer 5.8.1</span></p></div>
            </a>
          </article>
          <article class="case-card" data-domain="thermal" data-keywords="laminate-contact-transfer 热传递 热阻 热学 材料 反演 热图 移动热源 热流">
            <a class="case-link" href="cases/laminate-contact-transfer/" aria-labelledby="case-thermal">
              <div class="card-visual theme-thermal"><canvas data-plot="thermal-card" role="img" aria-label="层合材料表面的瞬态热分布示意"></canvas></div>
              <div class="card-body"><h3 id="case-thermal">层合材料热接触反演</h3><p class="case-meta"><strong>热学</strong> <span>Elmer FEM 26.2.1</span></p></div>
            </a>
          </article>
          <article class="case-card" data-domain="metabolism" data-keywords="VCell glycolysis-redistribution 系统生物学 代谢 反应扩散 糖酵解 空间扰动 ATP 周转">
            <a class="case-link" href="cases/glycolysis-redistribution/" aria-labelledby="case-metabolism">
              <div class="card-visual theme-metabolism"><canvas data-plot="metabolism-card" role="img" aria-label="空间代谢模型在不同时刻的浓度分布示意"></canvas></div>
              <div class="card-body"><h3 id="case-metabolism">空间糖酵解分配</h3><p class="case-meta"><strong>生物学</strong> <span>Virtual Cell 8.1.8.06</span></p></div>
            </a>
          </article>
          <article class="case-card" data-domain="mechanics" data-keywords="donnan-bilayer-transfer 软材料力学 水凝胶 双层 凝胶 膨胀 溶胀 变形 自由行程 阻挡力">
            <a class="case-link" href="cases/donnan-bilayer-transfer/" aria-labelledby="case-gel">
              <div class="card-visual theme-gel"><canvas data-plot="gel-card" role="img" aria-label="粘合双层凝胶弯曲与变形网格示意"></canvas></div>
              <div class="card-body"><h3 id="case-gel">Donnan 双层凝胶</h3><p class="case-meta"><strong>材料学</strong> <span>FEBio Studio 3.2</span></p></div>
            </a>
          </article>
        </div>
        <p class="case-note" id="case-note">封面均为示意图</p>
        <div class="empty-state" id="empty-state" hidden><p>没有匹配的案例。</p><button type="button" id="reset-search">清除搜索与筛选</button></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap footer-inner"><a href="https://github.com/cioutn/simulationle-science">GitHub 仓库 <span aria-hidden="true">↗</span></a></div></footer>
</body>
</html>
